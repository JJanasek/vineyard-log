name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages for this repository if it is not yet (source = GitHub Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Export app content (unit test writes app/build/site-content)
        # --rerun: the JSON files are a side effect of the test, so a build-cache hit must not skip it
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'cz.janek.vineyardlog.site.ContentExportTest' --rerun
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install jinja2
      - run: python3 web/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
