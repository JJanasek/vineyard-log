name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      # A debug build is signed with whatever debug keystore the machine has, and a runner makes a
      # fresh one every time, so debug-signed releases can never install over each other. The
      # release is signed with a keystore kept as a repository secret instead.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. See the release signing section of the README: generate a keystore once and add it with its passwords as repository secrets, otherwise every release would be signed with a throwaway key and could not update the previous one."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build and sign
        env:
          VINEYARD_KEYSTORE: ${{ runner.temp }}/release.jks
          VINEYARD_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          VINEYARD_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          VINEYARD_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Check the APK is signed, and print the fingerprint
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          # the fingerprint has to stay the same from one release to the next, or the update is refused
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -i "SHA-256 digest" | head -1 >> "$GITHUB_STEP_SUMMARY"

      - run: cp app/build/outputs/apk/release/app-release.apk vineyard-log-${GITHUB_REF_NAME}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: vineyard-log-*.apk
          generate_release_notes: true
