{% extends "base.html" %}{% block content %}
<h1>{{ t.guide }}</h1>
<p class="muted">{{ t.guide_intro }}</p>
{% for kind, items in groups %}
<h2>{{ kind }}</h2>
<div class="grid">
{% for e in items %}<div class="card">{% if e.images %}<a href="{{ e.key }}.html"><img src="{{ root }}img/guide/{{ e.images[0] }}" alt=""></a>{% endif %}
<h3><a class="title" href="{{ e.key }}.html">{{ e.name[lang] }}</a></h3><div class="muted"><i>{{ e.latin }}</i></div></div>{% endfor %}
</div>
{% endfor %}
{% endblock %}
